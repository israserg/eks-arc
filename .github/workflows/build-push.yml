name: Build and push to ECR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-push.yml"

env:
  AWS_REGION: eu-north-1
  # Matches aws_ecr_repository.demo in ecr.tf
  ECR_REPOSITORY: eks-arc-demo

jobs:
  build-test-push:
    # Runner scale set created by Terraform (helm release "arc-runners").
    runs-on: arc-runners
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set image version
        run: |
          # Unique, traceable version: 1.0.<run number>-<short commit>
          echo "IMAGE_VERSION=1.0.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t "$ECR_REPOSITORY:$IMAGE_VERSION" app/

      - name: Run and test the container
        run: |
          docker run -d --name test-app -p 8080:80 "$ECR_REPOSITORY:$IMAGE_VERSION"
          # nginx may need a moment to start. Retry for up to 20 seconds.
          for i in $(seq 1 10); do
            if curl -fs http://localhost:8080 | grep -q "ARC runner test"; then
              echo "Test passed: page served on port 8080"
              docker rm -f test-app
              exit 0
            fi
            sleep 2
          done
          echo "Test failed: page not served"
          docker logs test-app
          docker rm -f test-app
          exit 1

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        # Uses the runner pod's Pod Identity role (ecr-push policy in ecr.tf).

      - name: Tag and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker tag "$ECR_REPOSITORY:$IMAGE_VERSION" "$IMAGE:$IMAGE_VERSION"
          docker push "$IMAGE:$IMAGE_VERSION"
          echo "Pushed $IMAGE:$IMAGE_VERSION"
